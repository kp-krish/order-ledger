name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and generate coverage
        run: ./mvnw --batch-mode verify
      - name: Test synthetic workload generator
        run: python -m unittest scripts.test_producer
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/site/jacoco
